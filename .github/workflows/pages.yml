name: Deploy Learn-X

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Contents write: the deploy job pushes the built dist/ tree to the gh-pages
# branch (Pages source = legacy branch deployment). The Actions artifact
# metadata service returned "Found 0 artifacts" for every deploy since
# 2026-11-24 even with artifacts present, so we bypass it entirely.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # server.test.mjs loads server.mjs, which imports the private sibling
      # skills checkout (../../../skills) that CI cannot fetch without a PAT;
      # it stays a local-gate test (docs/TECH.md 开发验证).
      - run: node --test $(ls app/code/scripts/*.test.mjs | grep -v server.test.mjs)
      - run: npm run build:public
      - run: npm run build:public:no-context
      - name: Publish dist to gh-pages branch (deterministic tree commit)
        run: |
          git config user.name "learn-x-pages-bot"
          git config user.email "yuwei@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/gh-pages-index"
          git read-tree --empty
          git add -A -f dist
          TREE=$(git write-tree --prefix=dist/)
          COMMIT=$(git commit-tree "$TREE" -m "deploy: learn-x pages build from $(git rev-parse --short HEAD)")
          git push -f origin "$COMMIT:refs/heads/gh-pages"

  # 全量测试含跨仓绝对路径依赖套件（本机兄弟仓 checkout），CI 无法解析；
  # 独立可见但不阻塞 Pages 部署。背景见 docs/cases/2026-11-learnx-pages-deploy-fix/。
  test-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
