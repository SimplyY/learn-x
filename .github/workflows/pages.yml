name: Deploy Learn-X

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # server.test.mjs loads server.mjs, which imports the private sibling
      # skills checkout (../../../skills) that CI cannot fetch without a PAT;
      # it stays a local-gate test (docs/TECH.md 开发验证).
      - run: node --test $(ls app/code/scripts/*.test.mjs | grep -v server.test.mjs)
      - run: npm run build:public
      - run: npm run build:public:no-context
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  # 全量测试含跨仓绝对路径依赖套件（本机兄弟仓 checkout），CI 无法解析；
  # 独立可见但不阻塞 Pages 部署。背景见 docs/cases/2026-11-learnx-pages-deploy-fix/。
  test-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
